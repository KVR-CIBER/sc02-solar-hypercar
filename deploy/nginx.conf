server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json model/gltf-binary text/markdown image/svg+xml;
    gzip_min_length 1024;
    location ~ \.glb$ { default_type model/gltf-binary; add_header Cache-Control "no-cache"; }
    location ~ \.md$ { default_type text/markdown; add_header Content-Disposition "attachment"; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    location ~ ^/(v1/)?files/.+\.(3mf|stl|zip|dxf|svg|step|md)$ { add_header Content-Disposition "attachment"; }
    location = /files/files.json { add_header Cache-Control "no-cache"; }
}
