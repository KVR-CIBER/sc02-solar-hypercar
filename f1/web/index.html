<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090d">
<title>SC-02</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"><div class="mark">SC<b>·</b>02</div><div class="bar"><i id="lp"></i></div></div>

<!-- power: the only numbers on screen -->
<section id="power">
  <div class="spd"><span id="kmh">0</span><small>km/h</small></div>
  <div class="bat"><div class="cell"><i id="soc"></i></div><span id="vb">0.0</span><small>V</small><span class="tot" id="ptot">0.0</span><small>W</small></div>
  <div class="rows">
    <div class="r"><svg viewBox="0 0 24 24"><path d="M4 12h3l2-5 4 10 2-5h5"/></svg><div class="b"><i id="bm"></i></div><span id="pm">0.0</span></div>
    <div class="r"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg><div class="b"><i id="bp"></i></div><span id="pp">0.0</span></div>
    <div class="r"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0"/><circle cx="12" cy="12" r="1"/></svg><div class="b"><i id="be"></i></div><span id="pe">0.0</span></div>
    <div class="r"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 12l5-3"/></svg><div class="b"><i id="bs"></i></div><span id="ps">0.0</span></div>
  </div>
</section>
<div id="lap"><span id="lt">0:00.000</span><span id="lb"></span></div>
<canvas id="map" width="260" height="260"></canvas>

<nav id="dock">
  <button id="bcam" title="camera (C)"><svg viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg></button>
  <button id="bset" title="instellingen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  <a id="bdl" href="files/" title="downloads"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></a>
  <button id="bres" title="reset (R)"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 3v5h5"/></svg></button>
</nav>

<aside id="sheet" class="hidden">
  <div class="grp"><div class="seg" id="sbat"><button data-v="aa">4×AA · 4.8 V</button><button data-v="lipo3s" class="on">3S · 11.1 V</button></div></div>
  <div class="grp"><div class="seg" id="slim"><button data-v="4.8" class="on">4.8 V</button><button data-v="6">6.0 V</button><button data-v="7.4">7.4 V</button></div></div>
  <div class="grp sw"><div class="seg" id="stc"><button data-v="1" class="on">TC</button><button data-v="0">off</button></div>
      <div class="seg" id="sxr"><button data-v="0" class="on">body</button><button data-v="1">x-ray</button></div></div>
  <div class="grp"><div class="sw" id="paint"><i data-c="#c4091d" class="on"></i><i data-c="#0d0f13"></i><i data-c="#e9ecef"></i><i data-c="#0b3d91"></i><i data-c="#f28a00"></i><i data-c="#0e6b4f"></i></div></div>
</aside>

<div id="touch"><div id="tsteer"><i></i></div><div id="tgas"></div><div id="tbrake"></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
