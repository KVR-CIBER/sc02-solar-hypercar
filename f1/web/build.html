<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SC-02 · Assemblage</title>
<style>
:root{--ink:#eef1f6;--mut:#8a93a3;--acc:#ff2d3c}
html,body{margin:0;height:100%;background:#0a0c10;color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#cap{position:fixed;left:clamp(16px,4vw,48px);bottom:clamp(16px,5vh,48px);pointer-events:none}
#cap .n{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--acc)}
#cap .t{font:300 clamp(20px,3.2vw,34px) system-ui;letter-spacing:.04em;margin-top:4px;transition:opacity .3s}
#mark{position:fixed;left:clamp(16px,4vw,48px);top:clamp(16px,4vh,40px);font:200 22px system-ui;letter-spacing:.35em}
#mark b{color:var(--acc);font-weight:400}
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--acc);width:0}
#ctl{position:fixed;right:16px;top:16px;display:flex;gap:8px}
#ctl button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 13px system-ui;cursor:pointer}
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head><body>
<canvas id="c"></canvas>
<div id="mark">SC<b>·</b>02</div>
<div id="cap"><div class="n" id="num"></div><div class="t" id="txt"></div></div>
<div id="bar"></div>
<div id="ctl"><button id="replay">↻ Opnieuw</button><button id="pause">❚❚</button></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";

const VIDEO = new URLSearchParams(location.search).has("video");
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: VIDEO });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c10); scene.fog = new THREE.Fog(0x0a0c10, 1.2, 3.2);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);

// studio floor with soft vignette + key light
const floorTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  const gr = g.createRadialGradient(256, 256, 4, 256, 256, 256); gr.addColorStop(0, "#2a2e36"); gr.addColorStop(0.12, "#16191f"); gr.addColorStop(1, "#0a0c10");
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 96), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(0.5, 1.3, 0.7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -0.4, right: 0.4, top: 0.4, bottom: -0.4, near: 0.1, far: 4 });
key.shadow.bias = -0.0004; key.shadow.radius = 6; scene.add(key);
const rim = new THREE.DirectionalLight(0x9ec5ff, 1.4); rim.position.set(-0.8, 0.5, -0.9); scene.add(rim);

// ---- assembly steps: [caption, parts, direction (CAD mm: x fwd, y left, z up), distance]
const STEPS = [   // order + directions verified collision-free against the CAD (every part, 40 samples per path)
  ["Vloer · 2 mm zwart plexi", ["floor"], [0, 0, -1], 140],
  ["Achter- en voormodule", ["rear_module", "front_module"], [0, 0, 1], 120],
  ["Lagerblokken", ["rear_bearing_L", "rear_bearing_R"], [0, 0, 1], 100],
  ["Tandwiel", ["spur"], [0, 0, 1], 90],
  ["Achteras schuift door lagers en tandwiel", ["axle_rear"], [0, 1, 0], 170],
  ["Lagerkapjes", ["bearing_cap_L", "bearing_cap_R"], [0, 0, 1], 80],
  ["Brushless 2435 schuift tegen de motorplaat", ["motor_F_can", "motor_F_cap", "motor_F_term", "motor_F_shaft", "pinion_F"], [0, 1, 0], 90],
  ["Motorklem", ["motor_clamp"], [0, 0, 1], 90],
  ["Stuurservo met stuurhoorn", ["servo", "steering_horn"], [0, 0, 1], 110],
  ["Fusees", ["front_upright_L", "front_upright_R"], "side", 60],
  ["Stuurstangen", ["tie_rod_L", "tie_rod_R"], [0, 0, 1], 60],
  ["ESC naast de motor", ["esc_tray", "esc"], [0, 0, 1], 110],
  ["Afstandsbussen", ["pcb_posts"], [0, 0, 1], 110],
  ["Stuurprint v3 (ESP32-S3 + ELRS)", ["pcb", "pcb_xt60", "pcb_esp32s3", "pcb_elrs_c3", "pcb_elrs_e28", "pcb_coil", "pcb_usbc", "pcb_hdr_esc", "pcb_hdr_hall", "pcb_hdr_servo", "pcb_jst_solar"], [0, 0, 1], 130],
  ["Batterijbak boven de print", ["battery_tray"], [0, 0, 1], 130],
  ["LiPo 2S", ["battery"], [0, 0, 1], 130],
  ["Magneetclips", ["clip_0L", "clip_0R", "clip_1L", "clip_1R", "clip_2L", "clip_2R", "clip_3L", "clip_3R"], [0, 0, 1], 80],
  ["Splitter", ["splitter"], [0, 0, -1], 60],
  ["Diffuser", ["diffuser"], [-1, 0, 0], 80],
  ["Achterwielen", ["rim_RL", "tyre_RL", "rim_RR", "tyre_RR"], "side", 140],
  ["Voorwielen", ["rim_FL", "tyre_FL", "rim_FR", "tyre_FR"], "side", 140],
  ["Carrosserie klikt op de magneten", ["body"], [0, 0, 1], 220],
  ["Zonnepaneel", ["panel"], [0, 0, 1], 120],
  ["Koepel", ["canopy"], [0, 0, 1], 120],
  ["Achtervleugel door de sleuven", ["rear_wing"], [0, 0, 1], 150],
];
const STEP_T = 1.3, START = 1.2, OUTRO = 6.0;
const TOTAL = START + STEPS.length * STEP_T + OUTRO;

const cad = new THREE.Group(); cad.rotation.x = -Math.PI / 2; cad.scale.setScalar(0.001); scene.add(cad);
const parts = {};
const gltf = await new GLTFLoader().loadAsync("models/sc02.glb");
gltf.scene.traverse((o) => {
  if (!o.isMesh) return;
  o.castShadow = o.receiveShadow = true;
  const n = o.name;
  o.geometry.deleteAttribute("normal"); o.geometry = toCreasedNormals(o.geometry, THREE.MathUtils.degToRad(n === "body" || n === "canopy" ? 50 : 35));
  if (n === "body") o.material = new THREE.MeshPhysicalMaterial({ color: 0xa8111b, roughness: 0.42, metalness: 0.05, clearcoat: 0.5, clearcoatRoughness: 0.18, envMapIntensity: 0.6 });
  else if (n === "canopy") o.material = new THREE.MeshPhysicalMaterial({ color: 0x0b0f16, roughness: 0.05, metalness: 0.3, clearcoat: 1 });
  else if (n === "panel") o.material = new THREE.MeshPhysicalMaterial({ color: 0x14204a, roughness: 0.2, metalness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05 });
  else if (n === "floor") o.material = new THREE.MeshStandardMaterial({ color: 0x16171a, roughness: 0.55, metalness: 0.0, envMapIntensity: 0.35 });
  const PRINTED = /^(rear_module|front_module|motor_clamp|rear_bearing|bearing_cap|front_upright|battery_tray|pcb_posts|esc_tray|clip_|steering_horn|tie_rod)/;
  if (PRINTED.test(n)) o.material = new THREE.MeshStandardMaterial({ color: 0xa7adb6, roughness: 0.55, metalness: 0.0 });   // light grey PLA
  o.material = o.material.clone();
});
while (gltf.scene.children.length) cad.add(gltf.scene.children[0]);
cad.traverse((o) => { if (o.isMesh) { o.geometry.computeBoundingBox(); const bb = o.geometry.boundingBox; parts[o.name] = { o, home: o.position.clone(), cy: (bb.min.y + bb.max.y) / 2 }; } });
// any mesh not in a step appears with the body
const used = new Set(STEPS.flatMap((s) => s[1]));
const bodyStep = STEPS.find((st) => st[1].includes("body")); for (const n in parts) if (!used.has(n)) bodyStep[1].push(n);

const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const num = document.getElementById("num"), txt = document.getElementById("txt"), bar = document.getElementById("bar");
let lastStep = -2;
function setTime(t) {
  STEPS.forEach(([cap, names, dir, dist], i) => {
    const k = ease((t - START - i * STEP_T) / (STEP_T * 0.95));
    for (const n of names) { const p = parts[n]; if (!p) continue;
      const v = dir === "side" ? new THREE.Vector3(0, Math.sign(p.cy) || 1, 0) : new THREE.Vector3(...dir).normalize();
      p.o.position.copy(p.home).addScaledVector(v, dist * (1 - k)); p.o.visible = t >= START + i * STEP_T; }
  });
  const si = Math.floor((t - START) / STEP_T);
  const cur = si >= STEPS.length ? STEPS.length : si;
  if (cur !== lastStep) { lastStep = cur;
    if (cur < 0) { num.textContent = ""; txt.textContent = "Assemblage"; }
    else if (cur >= STEPS.length) { num.textContent = "KLAAR"; txt.textContent = "SC-02 Solar Hypercar"; }
    else { num.textContent = String(cur + 1).padStart(2, "0") + " / " + STEPS.length; txt.textContent = STEPS[cur][0]; } }
  bar.style.width = (Math.min(1, t / TOTAL) * 100) + "%";
  // camera: slow orbit around the car, a bit higher while building, lower for the hero shot
  const c = new THREE.Vector3(0.136, 0.02, 0);
  const a = 0.9 + t * 0.11, end = ease((t - (TOTAL - OUTRO)) / 3);
  const r = 0.64 - 0.1 * end, h = 0.36 - 0.2 * end;
  camera.position.set(c.x + r * Math.cos(a), h, c.z + r * Math.sin(a)); camera.lookAt(c);
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

let t = 0, paused = false, last = performance.now();
document.getElementById("replay").onclick = () => { t = 0; };
document.getElementById("pause").onclick = (e) => { paused = !paused; e.target.textContent = paused ? "▶" : "❚❚"; };
if (VIDEO) {
  document.getElementById("ctl").style.display = "none";
  const fps = 30;
  window.__video = { fps, frames: Math.ceil(TOTAL * fps), frame: (f) => { setTime(f / fps); renderer.render(scene, camera); } };
  window.__ready = true;
} else {
  renderer.setAnimationLoop((now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!paused) { t += dt; if (t > TOTAL + 2) t = 0; }
    setTime(t); renderer.render(scene, camera);
  });
}
</script>
</body></html>
